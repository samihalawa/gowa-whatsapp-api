interface:
  display_name: "GOWA WhatsApp API"
  short_description: "Use direct curl calls to GOWA for WhatsApp chats, groups, self-hosted webhooks, and outreach"
  default_prompt: "Use $gowa-whatsapp-api for WhatsApp automation. Prefer direct curl calls to GOWA over any MCP wrapper. First inspect /devices and select the account that contains the requested chat. For Twenty synchronization, exhaustively page every chat/message source, then idempotently upsert one generic External Activity per nonempty chat by gowa:<device-slug>:<jid>, preserve every native message ID in chronological Content, and link only exact Person, Company, and Opportunity matches. Never create one CRM record per WhatsApp message or duplicate the history into Notes."
