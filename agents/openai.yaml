interface:
  display_name: "GOWA WhatsApp API"
  short_description: "Use direct curl calls to GOWA for WhatsApp chats, groups, self-hosted webhooks, and outreach"
  default_prompt: "Use $gowa-whatsapp-api for WhatsApp automation. Prefer direct curl calls to GOWA over any MCP wrapper. For the managed shared instance, first inspect /devices, then select the logged-in account that contains the requested chat and include that confirmed device_id on every call; never hard-code a device name. For self-hosted GOWA, support /app multi-device workflows and WHATSAPP_WEBHOOK-based inbound event delivery. When the workflow calls for saving qualified leads into Apple contacts, use the documented iCloud CardDAV PUT pattern with vCard 3.0 and UID/filename match."
