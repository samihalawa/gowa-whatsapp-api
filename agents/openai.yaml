interface:
  display_name: "GOWA WhatsApp API"
  short_description: "Use direct curl calls to GOWA for WhatsApp chats, groups, self-hosted webhooks, and outreach"
  default_prompt: "Use $gowa-whatsapp-api for WhatsApp automation. Prefer direct curl calls to GOWA over any MCP wrapper. For the managed shared instance, use gowa.megawebs.com through the cors.trigox.workers.dev proxy and always include device_id=sami. For self-hosted GOWA, support /app multi-device workflows and WHATSAPP_WEBHOOK-based inbound event delivery. When the workflow calls for saving qualified leads into Apple contacts, use the documented iCloud CardDAV PUT pattern with vCard 3.0 and UID/filename match."
