interface:
  display_name: "GOWA WhatsApp API"
  short_description: "Use direct curl calls to GOWA for WhatsApp chats, groups, self-hosted webhooks, and outreach"
  default_prompt: "Use $gowa-whatsapp-api for WhatsApp automation. Prefer direct GOWA API calls over an MCP wrapper and verify /devices first. For routine Twenty synchronization, run one daily delta job: cache normalized Twenty Person phones, discard unmatched and non-direct chats before AI, classify each changed matched conversation once, upsert one generic WHATSAPP External Activity by gowa:<device>:<jid>, read it back, then checkpoint; an immediate replay must do zero work. Use exhaustive all-chat history recovery only when explicitly requested. Never create one CRM record per message or duplicate history into Notes."
